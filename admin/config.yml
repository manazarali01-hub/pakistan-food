backend:
  name: github
  repo: manazarali01-hub/pakistan-food
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "recipes"
    label: "Recipes"
    folder: "recipes"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Recipe Name"
        name: "name"
        widget: "string"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Rice"
          - "Chicken"
          - "Beef"
          - "BBQ"
          - "Snacks"
          - "Breakfast"
          - "Desserts"

      - label: "Cooking Time"
        name: "time"
        widget: "string"

      - label: "Rating"
        name: "rating"
        widget: "string"
        default: "4.5"

      - label: "Image"
        name: "image"
        widget: "image"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Ingredients"
        name: "ingredients"
        widget: "list"

      - label: "Method"
        name: "method"
        widget: "list"
