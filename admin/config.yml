backend:
  name: github
  repo: manazarali01-hub/pakistan-food
  branch: main

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "recipes"
    label: "Recipes"
    folder: "_data/recipes"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"

    fields:
      - label: "Recipe Name"
        name: "name"
        widget: "string"
      - label: "Recipe Name (Urdu)"
        name: "name_urdu"
        widget: "string"
        required: false
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Rice"
          - "Chicken"
          - "Beef"
          - "BBQ"
          - "Snacks"
          - "Breakfast"
          - "Desserts"
          - "Drinks"
          - "Vegetarian"
      - label: "Cooking Time"
        name: "time"
        widget: "string"
      - label: "Servings"
        name: "serves"
        widget: "number"
        default: 4
      - label: "Image"
        name: "image"
        widget: "image"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Urdu Description"
        name: "description_ur"
        widget: "text"
        required: false
      - label: "Ingredients"
        name: "ingredients"
        widget: "list"
      - label: "Ingredients (Urdu)"
        name: "ingredients_ur"
        widget: "list"
        required: false
      - label: "Method"
        name: "method"
        widget: "list"
      - label: "Method (Urdu)"
        name: "method_ur"
        widget: "list"
        required: false
      - label: "Recipe-specific Tips"
        name: "tips"
        widget: "list"
        required: false
      - label: "Tips (Urdu)"
        name: "tips_ur"
        widget: "list"
        required: false
      - label: "Storage Advice"
        name: "storage"
        widget: "text"
        required: false
      - label: "Storage Advice (Urdu)"
        name: "storage_ur"
        widget: "text"
        required: false
      - label: "Serving Suggestion"
        name: "serving"
        widget: "text"
        required: false
      - label: "Serving Suggestion (Urdu)"
        name: "serving_ur"
        widget: "text"
        required: false
