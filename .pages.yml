media:
  - name: recipe_images
    label: Recipe Images
    path: assets

content:
  - name: recipes
    label: Recipes
    type: collection
    path: _data/recipes
    format: json
    filename: "{primary}.json"
    view:
      fields: [name, category, time]
      primary: name
    fields:
      - name: name
        label: Recipe Name
        type: string
        required: true
      - name: name_urdu
        label: Recipe Name (Urdu)
        type: string
      - name: category
        label: Category
        type: select
        required: true
        options:
          - Rice
          - Chicken
          - Beef
          - BBQ
          - Snacks
          - Breakfast
          - Desserts
          - Drinks
          - Vegetarian
      - name: time
        label: Cooking Time
        type: string
        required: true
      - name: serves
        label: Servings
        type: number
        default: 4
      - name: image
        label: Recipe Image
        type: image
        required: true
      - name: image_alt
        label: Image Alt Text
        type: string
      - name: image_caption
        label: Image Caption
        type: text
      - name: prep_time
        label: Prep Time
        type: string
      - name: cook_time
        label: Cook Time
        type: string
      - name: prep_time_iso
        label: Prep Time ISO 8601
        type: string
      - name: cook_time_iso
        label: Cook Time ISO 8601
        type: string
      - name: total_time_iso
        label: Total Time ISO 8601
        type: string
      - name: description
        label: Description
        type: text
        required: true
      - name: description_ur
        label: Urdu Description
        type: text
      - name: ingredients
        label: Ingredients
        type: string
        list: true
      - name: ingredients_ur
        label: Ingredients (Urdu)
        type: string
        list: true
      - name: method
        label: Cooking Method
        type: string
        list: true
      - name: method_ur
        label: Cooking Method (Urdu)
        type: string
        list: true
      - name: tips
        label: Recipe-specific Tips
        type: string
        list: true
      - name: tips_ur
        label: Recipe-specific Tips (Urdu)
        type: string
        list: true
      - name: storage
        label: Storage Advice
        type: text
      - name: storage_ur
        label: Storage Advice (Urdu)
        type: text
      - name: serving
        label: Serving Suggestion
        type: text
      - name: serving_ur
        label: Serving Suggestion (Urdu)
        type: text
      - name: technique
        label: Technique That Matters
        type: text
      - name: doneness_cues
        label: Visual / Doneness Cues
        type: string
        list: true
      - name: mistakes
        label: Mistakes to Avoid
        type: string
        list: true
      - name: substitutions
        label: Substitutions & Adjustments
        type: string
        list: true
      - name: reheating
        label: Reheating Advice
        type: text
      - name: faqs
        label: Recipe FAQs
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text
      - name: date_modified
        label: Last Editorial Update
        type: string
