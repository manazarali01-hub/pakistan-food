media:
  - name: recipe_images
    label: Recipe Images
    path: assets

content:
  - name: recipes
    label: Recipes
    type: collection
    path: _data/recipes
    format: json
    filename: "{primary}.json"
    view:
      fields: [name, category, time]
      primary: name
    fields:
      - name: name
        label: Recipe Name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          - Rice
          - Chicken
          - Beef
          - BBQ
          - Snacks
          - Breakfast
          - Desserts
          - Drinks
          - Vegetarian
      - name: time
        label: Cooking Time
        type: string
        required: true
      - name: serves
        label: Servings
        type: number
        default: 4
      - name: image
        label: Recipe Image
        type: image
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: ingredients
        label: Ingredients
        type: string
        list: true
      - name: method
        label: Cooking Method
        type: string
        list: true
