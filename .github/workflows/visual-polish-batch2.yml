name: Visual Polish Batch 2

on:
  push:
    branches:
      - visual-polish-batch2-2026-10-04
    paths:
      - 'scripts/visual_polish_batch2.py'
      - '.github/workflows/visual-polish-batch2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: visual-polish-batch2-2026-10-04
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Process four priority photos
        run: python3 scripts/visual_polish_batch2.py
      - name: Commit polished photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml _data/recipes assets docs/visual-polish-batch2-2026-10-04.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Polish second priority recipe image batch"
          git push origin HEAD:visual-polish-batch2-2026-10-04
