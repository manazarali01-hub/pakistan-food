name: Pages Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_layouts/**'
      - '_data/**'
      - 'recipes/**'
      - 'index.html'
      - 'sitemap.xml'
      - 'sitemap.html'
      - 'robots.txt'
      - '_config.yml'
      - 'style.css'
      - 'script.js'

permissions:
  contents: read

jobs:
  build:
    name: Validate Jekyll build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
