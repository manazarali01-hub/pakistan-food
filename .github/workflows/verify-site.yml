name: Verify Pakistan Food

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated recipe pages and sitemap are already synchronized
        run: |
          python scripts/sync_recipes.py
          git diff --exit-code -- sitemap-v2.xml recipes/
      - name: Test FAQ validation regression cases
        run: python -m unittest discover -s tests -p 'test_faq_validation.py' -v
      - name: Validate recipe data, SEO metadata, internal links and sitemap
        run: python scripts/verify_site.py
