name: Visual Polish Repair

on:
  push:
    branches:
      - visual-polish-repair-2026-10-04
    paths:
      - 'scripts/visual_polish_repair.py'
      - '.github/workflows/visual-polish-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: visual-polish-repair-2026-10-04
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Repair priority recipe imagery
        run: python3 scripts/visual_polish_repair.py
      - name: Commit repaired images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml _data/recipes assets docs/visual-polish-repair-2026-10-04.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Repair priority recipe images"
          git push origin HEAD:visual-polish-repair-2026-10-04
