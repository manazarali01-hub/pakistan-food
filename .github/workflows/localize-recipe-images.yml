name: Localize Recipe Images

on:
  push:
    branches:
      - localize-recipe-images-2026-10-04
    paths:
      - '_data/recipes/**'
      - 'scripts/localize_recipe_images.py'
      - '.github/workflows/localize-recipe-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: localize-recipe-images-2026-10-04
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Mirror licensed external recipe images
        run: python3 scripts/localize_recipe_images.py
      - name: Commit localized images
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/recipes assets/recipe-images docs/image-localization-report-2026-10-04.json
          git commit -m "Self-host licensed recipe images"
          git push origin HEAD:localize-recipe-images-2026-10-04
