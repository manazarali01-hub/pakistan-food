name: Premium Food Photo Crops

on:
  push:
    branches:
      - premium-food-photo-crops-2026-10-04
    paths:
      - 'scripts/premium_food_photo_crops.py'
      - '.github/workflows/premium-food-photo-crops.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: premium-food-photo-crops-2026-10-04
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Replace rejected photos and crop full library
        run: python3 scripts/premium_food_photo_crops.py
      - name: Commit processed photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/recipes assets docs/premium-food-photo-crops-2026-10-04.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Replace weak recipe photos and tighten mobile crops"
          git push origin HEAD:premium-food-photo-crops-2026-10-04
