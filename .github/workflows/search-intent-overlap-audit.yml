name: Search Intent Overlap Audit
on:
  push:
    branches:
      - final-image-and-query-quality-pass-2026-10-04
    paths:
      - 'scripts/audit_search_intent.py'
      - '.github/workflows/search-intent-overlap-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: final-image-and-query-quality-pass-2026-10-04
      - run: python3 scripts/audit_search_intent.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/search-intent-overlap-2026-10-04.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit overlapping search intent"
          git push origin HEAD:final-image-and-query-quality-pass-2026-10-04
