name: Generate mobile recipe image variants

on:
  push:
    branches:
      - 'images/**'
    paths:
      - '_data/recipes/*.json'
      - 'scripts/generate_recipe_image_variants.py'
      - '.github/workflows/optimize-recipe-image-variants.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out optimization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install Pillow
      - name: Generate responsive WebP variants
        run: python scripts/generate_recipe_image_variants.py
      - name: Commit generated variants to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/
          if git diff --cached --quiet; then
            echo "No image variants changed."
          else
            git commit -m "Add mobile-sized WebP recipe image variants"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
