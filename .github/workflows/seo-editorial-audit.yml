name: SEO and Editorial Quality Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_data/recipes/**'
      - 'guides/**'
      - '_layouts/recipe.html'
      - '_layouts/category.html'
      - '_config.yml'
      - 'index.html'
      - 'recipes/**'
      - 'about.html'
      - 'contact.html'
      - 'privacy-policy.html'
      - 'terms.html'
      - 'disclaimer.html'
      - 'editorial-policy.html'
      - 'image-credits.html'
      - 'sitemap.html'
      - 'sitemap.xml'
      - 'sitemap-v2.xml'
      - 'robots.txt'
      - 'ads.txt'
      - 'scripts/audit_content_quality.py'
      - 'scripts/audit_recipe_quality.py'
      - 'scripts/audit_image_quality.py'
      - 'scripts/verify_site.py'
      - 'scripts/verify_rendered.py'
      - '.github/workflows/seo-editorial-audit.yml'

permissions:
  contents: read

jobs:
  editorial-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Verify 66 recipe sources, sitemaps, Urdu fields and basic attribution
        run: python3 scripts/verify_site.py
      - name: Measure recipe depth and exact duplicated content
        run: python3 scripts/audit_recipe_quality.py
      - name: Audit photographic source attribution, alt text and image delivery
        run: python3 scripts/audit_image_quality.py
      - name: Detect indexed thin/duplicated guides and sitemap-noindex conflicts
        run: python3 scripts/audit_content_quality.py
      - name: Enforce no duplicated indexed guides or indexing conflicts
        run: python3 scripts/audit_content_quality.py --strict
      - name: Build production-equivalent Jekyll HTML
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify published page canonicals, schema, ads.txt, links and assets
        run: python3 scripts/verify_rendered.py
