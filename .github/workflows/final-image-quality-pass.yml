name: Final Image Quality Pass

on:
  push:
    branches:
      - final-image-and-query-quality-pass-2026-10-04
    paths:
      - 'scripts/final_image_quality_pass.py'
      - '.github/workflows/final-image-quality-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: final-image-and-query-quality-pass-2026-10-04
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Process requested final image batch
        run: python3 scripts/final_image_quality_pass.py
      - name: Commit final image batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/recipes assets docs/final-image-quality-pass-2026-10-04.json
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Apply final requested recipe image quality pass"
          git push origin HEAD:final-image-and-query-quality-pass-2026-10-04
